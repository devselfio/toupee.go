name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: make check
        run: make check

      - name: make build
        run: make build

      - name: make test
        run: make test

      - name: spec pass count
        run: make spec-count

      - name: spec drift
        run: make spec-drift
